apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-federated-auth-config
  namespace: proxysql
data:
  clusters.yaml: |
    renewal:
      interval: "1h"
      token_duration: "168h"
      renew_before: "48h"

    clusters:
      local:
        issuer: "https://kubernetes.default.svc.cluster.local"
        ca_cert: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        token_path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-federated-auth
  namespace: proxysql
  labels:
    app: kube-federated-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-federated-auth
  template:
    metadata:
      labels:
        app: kube-federated-auth
    spec:
      serviceAccountName: kube-federated-auth
      containers:
      - name: api
        image: rophy/kube-federated-auth:0.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: CONFIG_PATH
          value: "/etc/kube-federated-auth/clusters.yaml"
        volumeMounts:
        - name: config
          mountPath: /etc/kube-federated-auth
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: kube-federated-auth-config
---
apiVersion: v1
kind: Service
metadata:
  name: kube-federated-auth
  namespace: proxysql
  labels:
    app: kube-federated-auth
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: kube-federated-auth
